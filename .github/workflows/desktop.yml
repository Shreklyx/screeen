# RETIRED – the Electron desktop app. The native apps (native.yml: native/windows, native/mac)
# replaced it: they are published to the "desktop-latest" release under the same names, and the
# installed Electron apps update to them. This build is kept for reference only: it runs by hand
# and publishes nothing.
name: Desktop app (Electron, retired)

on:
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            builder: --win --x64
            app: desktop/dist/win-unpacked/Screen Share.exe
            smoke: --smoke-capture
          - os: macos-latest
            builder: --mac --universal
            app: desktop/dist/mac-universal/Screen Share.app/Contents/MacOS/Screen Share
            smoke: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            desktop/package-lock.json

      - name: Install
        run: |
          npm ci
          npm ci --prefix desktop

      # server + direct mode (UDP transport, relay, audio worklet) on this OS's network stack
      - name: Tests
        run: npm test

      # ss-audio.exe: Windows 5.1/7.1 system audio; ss-capture.exe: screen capture + NVENC for
      # direct mode (desktop/native); /MT = no VC++ runtime needed
      - name: Build the native helpers
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          for /f "usebackq delims=" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do set "VS=%%i"
          call "%VS%\VC\Auxiliary\Build\vcvars64.bat" || exit /b 1
          cl /nologo /std:c++17 /O2 /EHsc /W3 /MT /Fo:desktop\native\ /Fe:desktop\native\ss-audio.exe desktop\native\ss-audio.cpp ole32.lib avrt.lib winmm.lib || exit /b 1
          cl /nologo /std:c++17 /O2 /EHsc /W3 /MT /Fo:desktop\native\ /Fe:desktop\native\ss-capture.exe desktop\native\ss-capture.cpp d3d11.lib dxgi.lib avrt.lib user32.lib || exit /b 1

      # ss-capture-mac: screen capture + VideoToolbox for direct mode, one per architecture
      # (the universal app gets both, joined)
      - name: Build the native helper (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop/native
        run: |
          xcrun swiftc --version
          xcrun swiftc -O -target arm64-apple-macos12.3 -o ss-capture-mac-arm64 ss-capture-mac.swift
          xcrun swiftc -O -target x86_64-apple-macos12.3 -o ss-capture-mac-x64 ss-capture-mac.swift
          lipo -info ss-capture-mac-arm64 ss-capture-mac-x64

      # every build gets a higher version: the installed apps update themselves to it (updates.js)
      - name: Build
        working-directory: desktop
        shell: bash # PowerShell would split "-c.extraMetadata.version=…" at the dot
        run: npx electron-builder ${{ matrix.builder }} --publish never -c.extraMetadata.version=1.1.${{ github.run_number }}

      - name: Update files
        shell: bash
        run: |
          ls -la desktop/dist
          if [ "$RUNNER_OS" = Windows ]; then test -f desktop/dist/latest.yml && cat desktop/dist/latest.yml; fi
          if [ "$RUNNER_OS" = macOS ]; then
            test -f desktop/dist/latest-mac.yml && cat desktop/dist/latest-mac.yml
            # the capture helper is in the app, for both architectures
            lipo -info "desktop/dist/mac-universal/Screen Share.app/Contents/Resources/ss-capture-mac" | tee /dev/stderr | grep -Eq "x86_64 arm64|arm64 x86_64"
          fi

      - name: "Smoke test (app starts, loads the site; on Windows also screen capture and the audio helper)"
        shell: bash
        run: |
          HOST_PASSWORD=ci PORT=8080 node server/server.js &
          sleep 3
          "${{ matrix.app }}" --url=http://127.0.0.1:8080/ --smoke-test ${{ matrix.smoke }} --smoke-log="$RUNNER_TEMP/smoke.log" || status=$?
          cat "$RUNNER_TEMP/smoke.log" || true
          exit ${status:-0}

      - uses: actions/upload-artifact@v4
        with:
          name: screenshare-${{ runner.os }}
          path: |
            desktop/dist/ScreenShare-Setup.exe
            desktop/dist/ScreenShare-mac.dmg
            desktop/dist/ScreenShare-mac.zip
            desktop/dist/latest.yml
            desktop/dist/latest-mac.yml
          if-no-files-found: error
