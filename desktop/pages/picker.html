<!doctype html>
<html lang="hu">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'">
  <title>Mit osztasz meg?</title>
  <link rel="stylesheet" href="app.css">
  <script src="picker.js" defer></script>
</head>
<body>
  <div class="picker">
    <header>
      <h1>Mit osztasz meg?</h1>
      <span class="muted">Dupla kattintással azonnal indul.</span>
    </header>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" data-type="screen" aria-selected="true">Teljes képernyő</button>
      <button class="tab" role="tab" data-type="window" aria-selected="false">Ablak</button>
    </div>
    <div id="grid" class="grid"><p class="empty">Betöltés…</p></div>
    <footer>
      <label id="audioRow" class="check"><input id="audio" type="checkbox" checked> Rendszerhang megosztása</label>
      <span id="macAudio" class="muted" hidden>Mac: a hanghoz a weboldalon válaszd a BlackHole-t Hangforrásnak.</span>
      <span class="spacer"></span>
      <button id="refresh" class="btn" type="button">Frissítés</button>
      <button id="cancel" class="btn" type="button">Mégse</button>
      <button id="share" class="btn btn-primary" type="button" disabled>Megosztás</button>
    </footer>
  </div>
</body>
</html>
